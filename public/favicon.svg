<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="teachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0AE4BA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Disc -->
  <rect width="100" height="100" rx="28" fill="#070B16" />
  <rect x="2" y="2" width="96" height="96" rx="26" stroke="#1E294B" stroke-width="1.5" />
  
  <!-- Teaching Signal Core: Hexagonal Knowledge Spark with Neural Loop -->
  <path d="M50 20 L78 36 L78 68 L50 84 L22 68 L22 36 Z" stroke="url(#teachGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
  
  <!-- AI Teacher Beacon / Dynamic Wave -->
  <path d="M32 50 Q41 32 50 50 T68 50" stroke="url(#teachGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="url(#teachGrad)" filter="url(#glow)" />
  <circle cx="32" cy="50" r="3.5" fill="#00F2FE" />
  <circle cx="68" cy="50" r="3.5" fill="#0AE4BA" />
  
  <!-- Pulse Sparkles -->
  <circle cx="50" cy="28" r="2.5" fill="#00F2FE" opacity="0.9" />
  <circle cx="50" cy="72" r="2.5" fill="#0AE4BA" opacity="0.9" />
</svg>